<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Monday Contact Filler Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 560px;
      margin: 40px auto;
      padding: 0 20px 40px;
      color: #1f1f1f;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    h2 {
      font-size: 15px;
      margin: 28px 0 12px;
    }

    p.hint {
      color: #666;
      font-size: 13px;
      margin-top: 0;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input,
    select {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 16px;
      background: #fff;
    }

    button {
      background: #0073ea;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #0060c2;
    }

    button.secondary {
      background: #f5f6f8;
      color: #323338;
      border: 1px solid #d0d4e4;
      margin-bottom: 16px;
    }

    button.secondary:hover {
      background: #ecedf5;
    }

    #column-map {
      display: none;
      border-top: 1px solid #eceff5;
      padding-top: 8px;
    }

    .field-row {
      margin-bottom: 4px;
    }

    .field-row label .required {
      color: #c62828;
    }

    #status {
      margin-top: 12px;
      font-size: 13px;
      min-height: 18px;
    }

    #status.error {
      color: #c62828;
    }

    #status.success {
      color: #2e7d32;
    }
  </style>
</head>
<body>
  <h1>Monday Contact Filler</h1>
  <p class="hint">Connect your Monday board and map columns used when filling WhatsApp and Xero.</p>

  <form id="settings-form">
    <label for="mondayApiToken">Monday API token</label>
    <input type="password" id="mondayApiToken" autocomplete="off" placeholder="From monday.com → Profile → API">

    <label for="mondayBoardId">Board ID</label>
    <input type="text" id="mondayBoardId" placeholder="e.g. 5089534126">

    <label for="mondaySubdomain">Workspace subdomain (optional)</label>
    <input type="text" id="mondaySubdomain" placeholder="e.g. yourcompany">

    <button type="button" id="load-columns" class="secondary">Load board columns</button>

    <div id="column-map">
      <h2>Column mapping</h2>
      <p class="hint">Match each contact field to a column on your board.</p>
      <div id="column-fields"></div>
    </div>

    <button type="submit">Save settings</button>
  </form>

  <div id="status"></div>

  <script src="column-fields.js"></script>
  <script src="options.js"></script>
</body>
</html>
