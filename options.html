<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Monday Contact Filler Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 480px;
      margin: 40px auto;
      padding: 0 20px;
      color: #1f1f1f;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    p.hint {
      color: #666;
      font-size: 13px;
      margin-top: 0;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 16px;
    }

    button {
      background: #0073ea;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #0060c2;
    }

    #status {
      margin-top: 12px;
      font-size: 13px;
      min-height: 18px;
    }

    #status.error {
      color: #c62828;
    }

    #status.success {
      color: #2e7d32;
    }
  </style>
</head>
<body>
  <h1>Monday Contact Filler</h1>
  <p class="hint">Configure your Monday board so WhatsApp and Xero can search items by name.</p>

  <form id="settings-form">
    <label for="mondayApiToken">Monday API token</label>
    <input type="password" id="mondayApiToken" autocomplete="off" placeholder="From monday.com → Profile → API">

    <label for="mondayBoardId">Board ID</label>
    <input type="text" id="mondayBoardId" placeholder="e.g. 5089534126">

    <label for="mondaySubdomain">Workspace subdomain (optional)</label>
    <input type="text" id="mondaySubdomain" placeholder="e.g. yourcompany">

    <button type="submit">Save settings</button>
  </form>

  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
